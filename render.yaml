services:
  - type: web
    name: smart-attendance-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./attendance_system.db
      - key: SECRET_KEY
        generateValue: true
